name: Deploy to GitHub Pages

# Publishes the site by syncing main into the gh-pages branch, which GitHub
# Pages serves. (The Pages REST API is not writable by the workflow token on
# this repo, so branch-based deployment is used instead.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish to gh-pages branch
        run: git push origin HEAD:gh-pages --force
