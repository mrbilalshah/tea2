<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ContrapTea 🫖: build your own tea machine</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫖</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <div id="logo">⚙️ Contrap<span>Tea</span> 🫖</div>
    <div id="mode-label" class="pill">BUILD MODE</div>
    <div class="spacer"></div>
    <button id="btn-run" class="big go">▶ RUN</button>
    <button id="btn-serve" class="big serve hidden">🫖 SERVE!</button>
    <div id="speed-wrap" class="hidden">
      <button class="speed sel" data-s="1">1×</button><button class="speed" data-s="2">2×</button><button class="speed" data-s="4">4×</button>
    </div>
    <div class="spacer"></div>
    <button id="btn-examples" title="Examples" aria-label="Examples"><span class="ico">📦</span><span class="lbl"> Examples</span></button>
    <button id="btn-new" title="New machine" aria-label="New machine"><span class="ico">🗑</span><span class="lbl"> New</span></button>
    <button id="btn-share" title="Share" aria-label="Share"><span class="ico">🔗</span><span class="lbl"> Share</span></button>
    <button id="btn-import" title="Import" aria-label="Import"><span class="ico">📥</span><span class="lbl"> Import</span></button>
    <button id="btn-help" title="Handbook" aria-label="Handbook"><span class="ico">📖</span><span class="lbl"> Handbook</span></button>
  </header>

  <main>
    <aside id="palette"></aside>
    <div id="canvas-wrap">
      <canvas id="game"></canvas>
      <div id="inspector" class="hidden"></div>
      <div id="cup-gauge" class="hidden"></div>
      <div id="zoom-ctl">
        <button id="z-in" aria-label="Zoom in">+</button>
        <button id="z-out" aria-label="Zoom out">−</button>
        <button id="z-fit" aria-label="Fit whole workshop">⤢</button>
      </div>
      <div id="ticker"></div>
    </div>
  </main>

  <div id="modal-veil" class="hidden">
    <div id="modal"></div>
  </div>

<script src="js/util.js"></script>
<script src="js/parts.js"></script>
<script src="js/sim.js"></script>
<script src="js/score.js"></script>
<script src="js/examples.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
